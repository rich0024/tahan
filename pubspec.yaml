name: tahan
description: A private, invitation-only app for twelve people.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Fonts. google_fonts is a development convenience only — before release,
  # vendor Caprasimo and Figtree into assets/fonts and switch TahanText over,
  # so first paint is never unstyled.
  google_fonts: ^6.2.1

  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
