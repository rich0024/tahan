include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Colours, type, spacing and radii come from the theme. A hard-coded value
    # is a bug, not a style preference — but the painters are the exception:
    # authored geometry is literal by definition.
    todo: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
    - use_super_parameters
